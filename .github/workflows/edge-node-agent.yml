name: Edge Node Agent Multi-Arch Packaging

on:
  push:
    paths:
      - 'infrastructure/node-agent/**'
      - 'infrastructure/obfuscation/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  package-agent:
    name: Build Multi-Arch Edge Node Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Arch Agent Image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: infrastructure
          file: infrastructure/docker/Dockerfile.node-agent
          platforms: linux/amd64,linux/arm64
          push: false
          tags: vpn-node-agent:latest
