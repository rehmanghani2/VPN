name: Android Release Build & Packaging

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify Code Health
        working-directory: mobile
        run: flutter analyze

      - name: Build Release APKs (Split per ABI)
        working-directory: mobile
        run: flutter build apk --split-per-abi --release

      - name: Build Android App Bundle (AAB for Google Play)
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/bundle/release/*.aab
