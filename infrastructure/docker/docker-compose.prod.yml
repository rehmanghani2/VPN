version: '3.8'

services:
  # 1. NestJS Control Plane Backend
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: vpn_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vpnadmin}:${POSTGRES_PASSWORD:-SuperSecretPassword2026!}@postgres:5432/${POSTGRES_DB:-vpn_prod}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-production-jwt-ultra-secret-key-vpn-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-production-jwt-refresh-secret-key-vpn-2026}
      NODE_AGENT_TOKEN: ${NODE_AGENT_TOKEN:-vpn-node-agent-secure-token-2026}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/vpn/servers || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Hardened PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: vpn_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpnadmin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPassword2026!}
      POSTGRES_DB: ${POSTGRES_DB:-vpn_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vpnadmin} -d ${POSTGRES_DB:-vpn_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: vpn_redis_prod
    restart: always
    volumes:
      - redis_prod_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-RedisAuthToken2026!}"]

  # 4. Automatic SSL / TLS Reverse Proxy (Caddy)
  caddy:
    image: caddy:2-alpine
    container_name: vpn_caddy_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-api.vpnplatform.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
