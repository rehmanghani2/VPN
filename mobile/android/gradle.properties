# Memory & JVM (Tuned to 1024m to avoid paging file exhaustion on low-RAM / low-disk systems)
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.daemon=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Set Gradle user home to E:/.gradle (3.38 GB free space)
systemProp.gradle.user.home=E:/.gradle

# Disable Kotlin incremental cross-drive issues
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
